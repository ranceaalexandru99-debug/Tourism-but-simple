<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FBFAF7" />
    <title>Turism, dar simplu! — planificator AI de călătorii</title>
    <meta name="description" content="Turism, dar simplu! îți face traseul pentru orice oraș din lume — atracții, buget, hartă, vreme și sfaturi locale, dintr-o singură căutare." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social preview (Open Graph + Twitter). After deploy, set og:url and make
         og:image an absolute https URL for best results. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Turism, dar simplu!" />
    <meta property="og:description" content="Planificator AI de călătorii — traseu personalizat, buget, hartă și sfaturi locale, pentru orice oraș." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turism, dar simplu!" />
    <meta name="twitter:description" content="Planificator AI de călătorii — traseu personalizat, buget, hartă și sfaturi locale, pentru orice oraș." />
    <meta name="twitter:image" content="/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        /* Light by default; the external no-flash script overrides to dark only
           if the user previously chose it — avoids a theme flash on load. */
        background: #FBFAF7;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button, input, textarea, select { font-family: inherit; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      ::selection { background: #A9862F40; }

      /* Interaction utilities (inline styles can't do :hover/:active) */
      .vai-lift { transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s, background .18s; }
      .vai-lift:hover { transform: translateY(-2px); }
      .vai-lift:active { transform: translateY(0) scale(.98); }
      .vai-press { transition: transform .12s cubic-bezier(.2,.8,.3,1), opacity .15s, box-shadow .18s, background .18s, color .18s, border-color .18s; }
      .vai-press:active { transform: scale(.96); }

      @keyframes vai-spin { to { transform: rotate(360deg); } }
      @keyframes vai-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes vai-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes vai-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes vai-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes vai-glow { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes vai-drift {
        0%,100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -24px) scale(1.08); }
        66% { transform: translate(-24px, 18px) scale(.95); }
      }
      @keyframes vai-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @keyframes vai-ring { from { transform: scale(.6); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }

      /* The phone frame fills the visible viewport. 100dvh (where supported)
         tracks mobile browsers' collapsing URL bar — with plain 100vh the
         bottom strip of the app hides behind Chrome's chrome. */
      .vai-frame { height: min(932px, 100vh); }
      @supports (height: 100dvh) {
        .vai-frame { height: min(932px, 100dvh); }
      }

      /* Pre-React splash: visible while the JS bundle loads on slow connections.
         React replaces #root's children on mount, so this vanishes automatically. */
      .vai-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #FBFAF7; color: #8B6E27;
      }
      .vai-boot-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #8B6E2733; border-top-color: #8B6E27;
        animation: vai-spin 0.9s linear infinite;
      }
      .vai-boot-text {
        font-family: "Fraunces", Georgia, serif; font-size: 18px; font-style: italic; letter-spacing: .2px;
      }
      html.vai-dark .vai-boot { background: #060e1c; color: #B8983F; }
      html.vai-dark .vai-boot-spinner { border-color: #B8983F33; border-top-color: #B8983F; }

      /* Users who have asked their OS for calmer motion get it here too: keep
         layout, kill loops and transitions. Standard technique for a11y. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vai-boot">
        <div class="vai-boot-spinner"></div>
        <div class="vai-boot-text">Turism, dar simplu!</div>
      </div>
    </div>
    <noscript>
      <div style="padding:40px 24px;max-width:520px;margin:0 auto;text-align:center;font-family:Georgia,serif;color:#8B6E27">
        <div style="font-size:22px;font-style:italic;margin-bottom:10px">Turism, dar simplu!</div>
        <div style="font-size:15px;color:#555;line-height:1.5">Aplicația are nevoie de JavaScript pentru a funcționa. Activează-l în browser și reîncarcă pagina.</div>
      </div>
    </noscript>
    <!-- No-flash theme (external, so a strict CSP can use script-src 'self') -->
    <script src="/noflash.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
