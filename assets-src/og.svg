<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Porcelain + antique-gold social card (matches the premium light theme). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#F0EDE4"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9BE72"/>
      <stop offset="1" stop-color="#8B6E27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="3" y="3" width="1194" height="624" fill="none" stroke="#EDE8DC" stroke-width="6"/>
  <circle cx="600" cy="150" r="220" fill="none" stroke="#8B6E27" stroke-opacity="0.12" stroke-width="4"/>

  <!-- pin mark -->
  <g transform="translate(600 150) scale(0.42) translate(-256 -230)">
    <path d="M256 118c-57 0-103 46-103 103 0 74 103 173 103 173s103-99 103-173c0-57-46-103-103-103z" fill="url(#gold)"/>
    <circle cx="256" cy="221" r="42" fill="#FBFAF7"/>
    <circle cx="256" cy="221" r="18" fill="url(#gold)"/>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" letter-spacing="-2">
    <tspan fill="#24211B">Turism,</tspan> <tspan fill="#8B6E27" font-style="italic">dar simplu!</tspan>
  </text>
  <text x="600" y="465" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#6B6455">
    Planificator AI de călătorii — orice oraș, dintr-o singură căutare
  </text>
</svg>
